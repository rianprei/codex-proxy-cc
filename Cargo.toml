[package]
name = "claudecodex"
version = "0.1.0"
edition = "2021"
description = "Anthropic Messages API proxy for Codex (ChatGPT login) models, for Claude Code"
license = "MIT"

[dependencies]
axum = "0.7"
bytes = "1"
futures-core = "0.3"
log = { version = "0.4", features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "fs"] }
tokio-stream = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
